<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img" aria-label="PathLight">
<style>
@keyframes sweep{0%{transform:translateX(-120px)}60%,100%{transform:translateX(720px)}}
@keyframes live{0%,100%{opacity:1}50%{opacity:.35}}
.sweep{animation:sweep 6s ease-in-out infinite} .live{animation:live 1.6s ease-in-out infinite}
</style>
<defs>
<linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#c9b48a"/><stop offset="1" stop-color="#c9b48a" stop-opacity="0"/></linearGradient>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#c9b48a" stop-opacity="0"/><stop offset=".5" stop-color="#c9b48a" stop-opacity=".05"/><stop offset="1" stop-color="#c9b48a" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="1" y="1" width="598" height="208" rx="18"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="600" height="210" fill="#121213"/>
<rect class="sweep" x="0" y="0" width="120" height="210" fill="url(#shine)"/>
<rect x="28" y="0" width="64" height="1.5" fill="#c9b48a"/>
</g>
<rect x="0.5" y="0.5" width="599" height="209" rx="18" fill="none" stroke="#262626"/>
<text x="28" y="54" font-family="'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="27" font-weight="400" letter-spacing="-0.3" fill="#ece8e1">PathLight</text>
<rect x="461" y="34" width="111" height="26" rx="13" fill="none" stroke="#262626"/>
<circle class="live" cx="475" cy="47" r="3" fill="#57534d"/>
<text x="485" y="51.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#a19d96">In progress</text>
<text y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#a19d96"><tspan x="28" dy="0">Autonomous career-intelligence platform. A multi-agent</tspan><tspan x="28" dy="22">LangGraph pipeline with rule checks before the LLM and MCP tools.</tspan></text>
<rect x="28" y="140" width="92" height="28" rx="14" fill="#151515" stroke="#262626"/><text x="41" y="158.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#a19d96">LangGraph</text><rect x="127.88" y="140" width="70" height="28" rx="14" fill="#151515" stroke="#262626"/><text x="140.88" y="158.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#a19d96">Gemini</text><rect x="205.8" y="140" width="48" height="28" rx="14" fill="#151515" stroke="#262626"/><text x="218.8" y="158.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#a19d96">MCP</text><rect x="261.76" y="140" width="77" height="28" rx="14" fill="#151515" stroke="#262626"/><text x="274.76" y="158.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#a19d96">MongoDB</text>
<text x="572" y="188" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#6d6a65">github.com/amarthya-14/pathlight ↗</text>
</svg>