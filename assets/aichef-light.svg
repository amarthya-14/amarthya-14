<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img" aria-label="AI Chef">
<style>
@keyframes sweep{0%{transform:translateX(-120px)}60%,100%{transform:translateX(720px)}}
@keyframes live{0%,100%{opacity:1}50%{opacity:.35}}
.sweep{animation:sweep 6s ease-in-out infinite} .live{animation:live 1.6s ease-in-out infinite}
</style>
<defs>
<linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#d97706"/><stop offset="1" stop-color="#d97706" stop-opacity="0"/></linearGradient>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#d97706" stop-opacity="0"/><stop offset=".5" stop-color="#d97706" stop-opacity=".10"/><stop offset="1" stop-color="#d97706" stop-opacity="0"/></linearGradient>
<clipPath id="c"><rect x="1" y="1" width="598" height="208" rx="18"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="600" height="210" fill="#f6f8fa"/>
<rect class="sweep" x="0" y="0" width="120" height="210" fill="url(#shine)"/>
<rect x="0" y="0" width="600" height="3" fill="url(#bar)"/>
</g>
<rect x="0.5" y="0.5" width="599" height="209" rx="18" fill="none" stroke="#d8dee4"/>
<text x="28" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.4" fill="#1f2328">AI Chef</text>
<rect x="491" y="34" width="81" height="26" rx="13" fill="none" stroke="#d8dee4"/>
<circle class="live" cx="505" cy="47" r="3.5" fill="#d97706"/>
<text x="515" y="51.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#57606a">Project</text>
<text y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#57606a"><tspan x="28" dy="0">Recipe generator powered by Hugging Face models —</tspan><tspan x="28" dy="22">turn the ingredients you have into a recipe.</tspan></text>
<rect x="28" y="140" width="63" height="28" rx="14" fill="#f3f4f6" stroke="#d8dee4"/><text x="41" y="158.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#57606a">React</text><rect x="98.6" y="140" width="114" height="28" rx="14" fill="#f3f4f6" stroke="#d8dee4"/><text x="111.6" y="158.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#57606a">Hugging Face</text><rect x="220.44" y="140" width="99" height="28" rx="14" fill="#f3f4f6" stroke="#d8dee4"/><text x="233.44" y="158.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#57606a">JavaScript</text>
<text x="572" y="188" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#8c959f">github.com/amarthya-14/Ai-Chef ↗</text>
</svg>