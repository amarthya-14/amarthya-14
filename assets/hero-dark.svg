<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Jonnalagadda Amarthya — AI/ML Engineer and Full-Stack Developer">
<style>
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,30px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,-24px)}}
@keyframes word{0%{opacity:0;transform:translateY(6px)}4%,30%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-6px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes live{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes ring{0%,70%,100%{opacity:0}12%,30%{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.g1{animation:drift1 14s ease-in-out infinite} .g2{animation:drift2 16s ease-in-out infinite}
.w0{animation:word 9s infinite;animation-delay:0.0s;opacity:0}.w1{animation:word 9s infinite;animation-delay:3.0s;opacity:0}.w2{animation:word 9s infinite;animation-delay:6.0s;opacity:0}
.cur{animation:blink 1s step-end infinite}
.live{animation:live 1.6s ease-in-out infinite}
.ring{animation:ring 3.3s ease-in-out infinite;opacity:0}
.r1{animation:rise .8s ease-out both} .r2{animation:rise .8s .15s ease-out both} .r3{animation:rise .8s .3s ease-out both} .r4{animation:rise .8s .45s ease-out both} .r5{animation:rise .8s .6s ease-out both}
</style>
<defs>
